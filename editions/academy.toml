# Edition 'academy' (P70, 1 Nov 2026; S-DEC1, 20 Nov 2026): a build of Academy with only some courses, from the same
# sources, theme, shell and rules. `courses`: the ids of the courses it holds ("all": every course); `omit`: what it
# leaves out, by panel kind ('changelog', 'backlog', 'build': a course's "How it was built" and build pages, 'figures':
# the Figure kinds page) and 'planned' (the planned courses on the home); `site`: the folder build.py writes, relative
# to kit/. `python3 kit/build.py --edition <name>` builds one; the full Academy is the edition "academy" and the default.
# kit/courses.py turns `courses` and `omit` into tuples and "all" into None.

title = "Academy"
courses = "all"
omit = []
site = "academy"
