# AI in Supply Chain Execution · the [pack] data the setup row writes into courses/ai-in-supply-chain-execution/course.toml
# (kit/pack.py's docstring is the schema; registry keys above [pack] are copied from courses/supply-chain-execution/course.toml
# and changed: id, short, label, name, color = "var(--purple)", tracks.AIE = ["supply-chain", "AI in execution · public"],
# tiles.AIE, data, vault, sourcing_part, prompts_doc = "docs/ai-in-supply-chain-execution-prompts.md").

goal = "By the end, the reader can take any claimed AI feature in order, warehouse or transport software and say which decision it makes or supports, which kind of technique is doing the work, what a person still decides, who carries the cost when it is wrong, and how strong the evidence is that it works."

order = ["AIE1","AIE2","AIE3","AIE4","AIE5","AIE6","AIE7","AIE8","AIE9","AIE10","AIE11","AIE12","AIE13","DD-AIE1"]
search_on = ["AIE1","AIE4","AIE10","AIE11","AIE12","DD-AIE1"]
model = "Opus 5.5"

[[units]]
code = "AIE1"
title = "What counts as AI here"
scope = "Four families of technique under one label, a ladder of automation, and the keys every later unit grades by."
deliverable = "family key + five-rung ladder + grade and setting key + decision map"
aim = "place a feature in a family and on a rung, and grade a claim about it"
takes = "none"
gives = "the family key, the ladder, the grade and setting key and the decision map that every later unit uses"

[[units]]
code = "AIE2"
title = "Optimisation and rules: the AI that was already there"
scope = "The execution decisions that have been computed for decades, what 'optimal' means, and what people do around an optimiser."
deliverable = "decision inventory across the three operations"
aim = "say which execution decisions are already computed, by what, and what the computation leaves out"
takes = "AIE1"
gives = "the decision inventory AIE6 to AIE8 walk, and the older family AIE3 and AIE4 are set against"

[[units]]
code = "AIE3"
title = "Prediction: what machine learning adds"
scope = "What is predicted in execution work, what a prediction is worth, and the ways a predictive claim goes wrong."
deliverable = "prediction sheet, four worked"
aim = "state what a prediction feeds, what it is compared with and what each kind of error costs"
takes = "AIE1, AIE2"
gives = "the prediction sheet and the baseline question that AIE6 to AIE8, AIE11 and AIE12 reuse"

[[units]]
code = "AIE4"
title = "Generative models and agents"
scope = "What a language model and an agent are, what they are sold to do in execution software, and how they fail."
deliverable = "agent permission sheet, two worked"
aim = "say what an assistant or an agent may read, call and do alone, and how it fails"
takes = "AIE1, AIE2, AIE3"
gives = "the permission sheet AIE10 and AIE13 reuse, and the failure modes AIE10 brings together"

[[units]]
code = "AIE5"
title = "The field evidence, read in full"
scope = "Eight field studies of people working with algorithms, read closely: setting, design, effect, and what transfers."
deliverable = "evidence table + 'a study you can lean on' sheet"
aim = "report a study by its setting, design and comparison, and say what transfers"
takes = "AIE1 to AIE4"
gives = "the evidence table AIE6 to AIE9, AIE12 and DD-AIE1 cite from"

[[units]]
code = "AIE6"
title = "In the warehouse"
scope = "The warehouse's decisions one by one: the family at work, the rung, who carries the cost, and the evidence."
deliverable = "six warehouse decision cards"
aim = "take a warehouse decision apart by family, rung, failure and cost-carrier"
takes = "AIE1, AIE2, AIE3, AIE5"
gives = "the decision card form AIE7 and AIE8 reuse, and the cards AIE9, AIE10 and DD-AIE1 build on"

[[units]]
code = "AIE7"
title = "In transport"
scope = "Transport's decisions one by one, and how the same feature differs for a shipper and for a provider."
deliverable = "six transport decision cards + shipper-against-provider table"
aim = "take a transport decision apart, for a shipper and for a provider"
takes = "AIE1, AIE2, AIE3, AIE5, AIE6"
gives = "transport cards for AIE9 and AIE13; the freight-desk decisions AIE4's agent acts on"

[[units]]
code = "AIE8"
title = "In order management"
scope = "The promise, the sourcing choice and the rest, with one promise traced through every prediction and rule under it."
deliverable = "five order decision cards + one traced promise"
aim = "trace a delivery promise through every prediction, optimisation and rule it rests on"
takes = "AIE1, AIE2, AIE3, AIE5, AIE6"
gives = "order cards and the traced promise for AIE9 and AIE13"

[[units]]
code = "AIE9"
title = "The person in the loop"
scope = "What research found about people who monitor, follow and override automation, and what follows for execution roles."
deliverable = "override sheet, three worked + cost-carrier matrix"
aim = "say what a person can really review, change and be held to at a given rung"
takes = "AIE1, AIE5, AIE6, AIE7, AIE8"
gives = "the override sheet and the cost-carrier matrix for AIE10, AIE13 and DD-AIE1"

[[units]]
code = "AIE10"
title = "Risk, rules and accountability"
scope = "Failure modes by family, the frameworks, the law by jurisdiction, and who answers when a feature errs."
deliverable = "risk register for one feature + questions for counsel and vendor"
aim = "list a feature's risks by family and name the framework, the text and the owner for each"
takes = "AIE2, AIE3, AIE4, AIE6, AIE9"
gives = "the risk register AIE13 uses, and the legal texts DD-AIE1 reads further"

[[units]]
code = "AIE11"
title = "Reading an AI claim"
scope = "The parts and kinds of a claim, the statistics that circulate traced to their origin, and a sheet for grading any claim."
deliverable = "claim sheet: six fictional claims and four circulating statistics worked"
aim = "grade a vendor's or an analyst's AI claim on the claim sheet"
takes = "AIE1, AIE3, AIE4, AIE5"
gives = "the claim sheet for AIE12 and AIE13"

[[units]]
code = "AIE12"
title = "Money and the pilot"
scope = "The cost lines an AI feature adds, why returns arrive late, and the pilot designed as an experiment."
deliverable = "pilot plan + cost-line table"
aim = "design a pilot that could show a feature does not work, and list what it costs"
takes = "AIE3, AIE5, AIE6, AIE11"
gives = "the pilot plan and cost lines AIE13's brief draws on"

[[units]]
code = "AIE13"
title = "Capstone: one feature, argued"
scope = "One AI feature argued from decision to pilot, on the case, from the course's own evidence."
deliverable = "worked feature brief + template + checklist"
aim = "write a brief for an AI feature that an operations lead, a data scientist and a sales lead can each check"
takes = "AIE1 to AIE12"
gives = "the course's closing artefact"

[[units]]
code = "DD-AIE1"
title = "Deep dive: algorithmic management on the floor"
scope = "Work assigned, measured and monitored by software: the evidence, the law by jurisdiction, and what the worker is shown."
deliverable = "transparency sheet (worker's and supervisor's view) + questions for representatives and counsel"
aim = "say what a labour feature collects, computes and shows, and which texts govern it where"
takes = "AIE5, AIE6, AIE9, AIE10"
gives = "the course's last unit; its row also works every open correction and flag"
