[[pack.audit_log]]
date = '2026-11-14'
text = "Audit 4, the final audit (Fable 5.2, a full read of the twelve units against the course goal and outcomes, and a read-through as the persona; no source re-checked). 19 findings (0 error, 7 should-fix, 12 minor), 10 contradictions between units, <strong>no REWRITE</strong>: the course delivers its goal, the Instagram half of the third clause as a reading that informs rather than decides, since no benchmark exists at that size. What is wrong is seam work: later units still describing an earlier unit as it was before its correction. 15 errata (14 applied, A4-13 worked later on the changed line) and 9 flags (syllabus flags F89, F92 to F96: the own-product ad label, the hours log, the email sign-up's place and notice, the profiles' go-live step, process notes in public text). Report: <code>audits/personal-brand/audit-4.md</code>."
[[pack.audit_log]]
date = '2026-11-14 · 15'
text = "Audit 3 (Fable 5.2, stratified sample, live search, with a full attribution pass). Units: PB9, PB10, DD-PB1, DD-PB2. <strong>PB9·PB10·DD-PB1·DD-PB2: PASS</strong>, all four: 51 claims sampled, 399 checked in all (the attribution pass checked every quotation, attribution and Sources title); 2 sampled FAIL (PB9 1 in 15, DD-PB2 1 in 10), 16 FAIL in all, 0 STALE, 7 unverifiable. No full audit triggered. Run in two parts: the first runs on 14 Nov opened no source (the turn's search budget was used up); re-run on 15 Nov from the same samples. Errata applied: PB9-4 to PB9-15 (the 55%/45% ad shares re-cited to YouTube Help 72902; Li et al.'s mechanism and the file's status corrected), PB10-1 to PB10-7, DD-PB1-1 to DD-PB1-9 (Pascual's quote's referent; Leif Abel's sales job; two titles), DD-PB2-1 to DD-PB2-8 (unemployment benefit after a resignation; the hazard figure; a title); DD-PB2-9 (the HMRC page title) applied to PB8 and DD-PB2 together; flags F97 to F100. Report: <code>audits/personal-brand/audit-3.md</code>."
