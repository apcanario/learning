]

# STATUS where the typed string is not "written <d Mon>" of the unit's front matter `written`
[pack.status]

[[pack.courses]]
key = 'PB'
name = 'Building a Personal Brand on Instagram and YouTube'
color = 'var(--teal)'
slug = 'pb'
goal = 'by the end of the course you can state in one sentence who your account is for and what it gives them; have run a publishing system for twelve weeks inside an hours budget you set yourself; and read your Instagram and YouTube numbers against sourced benchmarks each quarter to decide, with evidence, whether to continue, change format or stop.'
tile = 'A step-by-step guide to a personal brand and a following on Instagram and YouTube, for someone with a job, a phone and a few hours a week. Every number sourced.'
intro = 'For an adult with a real skill, a full-time job and 3 to 10 hours a week: what to expect, how to position the account, how to build a publishing system and make the pieces with a phone, how growth works on YouTube and on Instagram, what the rules are, what pays, and how to read the numbers each quarter. Worked throughout on one fictional creator, Mara Venn, and shipped each time as a template. Ten core units in four parts and two deep dives.'
outcomes = '<li><strong>Outcome 1</strong> — a positioning a stranger can repeat, live on both profiles (PB2, PB3; DD-PB1 sets it beside six documented creators).</li><li><strong>Outcome 2</strong> — a publishing system held for twelve weeks inside your own hours budget (PB4, PB5, PB8).</li><li><strong>Outcome 3</strong> — a quarterly decision to continue, change format or stop, made on your numbers against sourced benchmarks (PB1, PB6, PB7, PB9, PB10; DD-PB2).</li>'
[[pack.courses.units]]
code = 'PB1'
title = 'What to expect: odds, timeline, cost'
scope = 'Sourced numbers for a one-person account on each platform, the time to each milestone, the plateau where most stop, and what it costs in hours and money.'
deliverable = 'expectation sheet + hours budget, stop rule and checkpoint dates'
aim = 'set a sourced expectation for your first year on each platform and write the rule under which you would stop'
takes = 'A9 as source material; A9 is YouTube-led, so the Instagram benchmarks are new research'
gives = 'the expectation sheet PB6, PB7 and PB10 read against; the hours budget PB3 and PB4 allocate; the checkpoint dates PB10 runs'
[[pack.courses.units]]
code = 'PB2'
title = 'Positioning: the sentence a stranger can repeat'
scope = 'What a positioning is, the patterns a personal brand is built on with the evidence for each graded, naming and handle checks, and the profile fields that carry it.'
deliverable = 'positioning statement + name pick + Instagram bio and YouTube description'
aim = 'state in one sentence who the account is for and what it gives them, and put that sentence into both profiles'
takes = 'A1 as source material; PB1'
gives = 'the positioning PB3 tests against an audience and PB4 turns into a series; the name PB8 checks for trademarks'
[[pack.courses.units]]
code = 'PB3'
title = 'Audience and the two platforms'
scope = 'Defining an audience from evidence, what Instagram and YouTube each do for a small account, where an email list fits, and how to split the hours.'
deliverable = 'audience profile + hours allocation at three budgets'
aim = 'describe your audience with a basis for every trait and split your hours between Instagram and YouTube'
takes = 'A2 as source material; PB1, PB2'
gives = 'the posting rates PB4 schedules; the platform roles PB6 and PB7 build on; the email-list evidence PB9 prices'
[[pack.courses.units]]
code = 'PB4'
title = 'The content system'
scope = 'Capture once, one anchor piece, derivatives from the same material; series and seasons; batching in two windows.'
deliverable = 'system checklist + 12-week calendar'
aim = 'run a publishing system that produces every post of a fortnight from two work sessions'
takes = 'A3 as source material; PB1, PB2, PB3'
gives = 'the calendar PB5 produces for; the cadence PB6, PB7 and PB10 measure'
[[pack.courses.units]]
code = 'PB5'
title = 'Production craft with a phone'
scope = "Audio, the opening seconds, structure, titles and thumbnails inside the platforms' own rules, Reels and carousels, and an edit that fits a time box."
deliverable = 'production checklist + timed edit template + Reel and carousel templates'
aim = 'film, package and edit a long-form video, a Reel and a carousel with a phone inside a fixed time box'
takes = 'A5 as source material, which covers YouTube; the Reel and carousel craft is new research; PB4'
gives = 'the packaging rules PB6 tests on YouTube and the format templates PB7 tests on Instagram'
[[pack.courses.units]]
code = 'PB6'
title = 'How YouTube growth works'
scope = 'Search, browse and suggested; click-through and retention; what Shorts do and do not do for long-form.'
deliverable = 'YouTube playbook + its rows of the metrics sheet'
aim = 'explain where a YouTube view comes from and read the Studio numbers that predict the next one'
takes = 'A6, its YouTube sections, as source material; PB1, PB3, PB5'
gives = "the YouTube rows of PB10's metrics sheet; the rules DD-PB1 reads the creators against"
[[pack.courses.units]]
code = 'PB7'
title = 'How Instagram growth works'
scope = "What reaches non-followers and what serves followers, by surface and by format, from Instagram's own statements and the vendor data."
deliverable = 'Instagram playbook + its rows of the metrics sheet'
aim = 'explain what reaches non-followers and what serves followers on Instagram and read the Insights numbers for each'
takes = 'A6, its Instagram sections, as source material; most of this unit is new research; PB1, PB3, PB5'
gives = "the Instagram rows of PB10's metrics sheet; the rules DD-PB1 reads the creators against"
[[pack.courses.units]]
code = 'PB8'
title = 'Voice, disclosure and the rules'
scope = "Honesty as register against confession as content, what stays private, and the rules on advertising, other people's image, music, employment and tax as questions to answer."
deliverable = 'disclosure policy with pre-mortem + constraints register'
aim = 'write down what you will and will not disclose and list every rule that applies to your account with the source that settles it'
takes = 'A4 and A8 as source material; A8 is written for one country, so only its structure and its platform-terms evidence carry over; PB2'
gives = "the disclosure rules PB9's brand deals follow; the open tax and contract questions DD-PB2 treats as inputs"
[[pack.courses.units]]
code = 'PB9'
title = 'Monetisation: what pays at each audience size'
scope = 'Platform revenue share, brand deals, an own product, a paid list, services; the conversion rates with their grades, and the lines that have no usable source.'
deliverable = 'revenue model in three scenarios'
aim = 'model what your account could earn in a year under three sets of stated assumptions'
takes = 'A7 as source material, for its conversion evidence and model structure only; PB1, PB3, PB8'
gives = 'the income lines DD-PB2 dates; the revenue rows PB10 reviews'
[[pack.courses.units]]
code = 'PB10'
title = 'Read your numbers: the quarterly review'
scope = "Which numbers, where the apps show them, how to set them against PB1's sheet, and the verdicts a review can reach."
deliverable = 'metrics sheet + review procedure, run on two quarters'
aim = 'run a quarterly review that ends in one of four verdicts, each backed by your own numbers'
takes = 'A6 (its metrics sheet) and A9 (its checkpoints and verdicts) as source material; PB1, PB2, PB3, PB4, PB6, PB7, PB9'
gives = "the review DD-PB2's dates depend on"
[[pack.courses.units]]
code = 'DD-PB1'
title = 'Deep dive: creators who did this'
scope = "Six documented creators chosen for spread of niche and platform, at least two of them Instagram-first, read against the course's own rules."
deliverable = 'comparables brief'
aim = 'compare your plan with six documented histories and say what they held constant'
takes = 'DD-A1 as source material; a creator of its five may be kept where the selection criteria admit them; PB1, PB6, PB7'
gives = "the comparables DD-PB2's timelines are checked against"
[[pack.courses.units]]
code = 'DD-PB2'
title = 'Deep dive: the quit-your-job math'
scope = 'A floor calculation with your own inputs: household floor, runway, and each income line with its sourced timeline or marked as unfilled.'
deliverable = 'threshold model'
aim = 'compute the income, the months and the savings at which leaving a job would be survivable for your household'
takes = "DD-A2 as source material, for the model's structure only; PB1, PB8, PB9, PB10, DD-PB1"
gives = "nothing; it is the course's last unit"

