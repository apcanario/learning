text = "v4. Errata (backlog row H-3; Opus 5.5, own agent contexts, P31: one drafter, one checker before anything was applied, one fresh figure-checker per changed figure). IA2 (P74, P75): the notation gains the reading-direction mark, a small triangle by a relationship label that cannot read left to right or top to bottom, pointing at the object it reads towards (section 5.2 Lines and Labels, the legend, the notation sheet); the legend's Screen row says a button is a control, its Surface: Label row says the title is in lower case, a row says nothing is drawn dashed, and its caption names WCAG 2.2, 1.4.1 and says the tones were added; the cross-surface map is redrawn on a grid with two crossings and every label clear, two labels marked, its surface-to-surface labels made verbs from IA1's table (the paragraph before it changed with them), a count at each end of the object lines, approves in Approvals [over the limit], and its caption's fidelity and citations brought to the text. IA1 (P76): figure 2's caption says what it places and why the structure row is shaded. The Fable 5.1 checks owed (P49) cover both."
