# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).

id = "ux"
family = "markdown"
short = "User Experience"
label = "USER EXPERIENCE"
name = "User Experience: courses for other designers"
color = "var(--blue)"
home_id = "ux"
status = "in progress"
# panel ids default to <id>-<key>: ux-ia, ux-ia-briefs, ux-ia-b-ia1 (no prefix, no legacy_ids)
tracks.IA = ["ux", "Information architecture"]
tiles.IA = "How to read, build and edit a product's structure, from sitemap to system map."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/ux/course.toml"
# the filed units (method.md §7), in this folder beside course.toml
vault = "courses/ux"
# sourcing-standard.md: this family's own part (howbuilt.py)
sourcing_part = "Part 4"
eyebrow = "USER EXPERIENCE"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (case and syllabus-flags
# files). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed string
# differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top changelog row).
[pack]
# the data file the How it was built footer names (byte identity until S-DEC3 changes it on purpose)
source = 'generator/data/ux/hub.py'
course_note = "Every unit is sourced to the field's standard works, Nielsen Norman Group research or peer-reviewed studies, labels vendor guidance and practice as such, carries its figures as drawings built from the unit's own content, and ends with a shipped deliverable built on the fictional Perqo."
order_lede = 'One row per unit in writing order. Opus 5.5 writes; a fresh context checks each unit before filing. "Search" means the unit is written with web search on because its facts are current.'
order_foot = 'The count starts at {start}.'
# not read by any kit/ script (the v5.1 standalone hub's identity and tiles); kept as the record. TEMPLATE_BLOCKS was [].
title = 'User Experience Courses'
bar = 'USER EXPERIENCE'
brand_html = 'USER <span>/</span> EXPERIENCE'
out = 'user-experience-courses.html'
theme_key = 'ux-theme'
learn_c = 'var(--blue)'
build_c = 'var(--orange)'
home_lede = 'Courses on the practice of UX, written to be handed to other designers. The first is Information Architecture.'
home_h1 = 'User Experience: the courses'
learn_note = 'Order of writing: the four parts in order (IA1 to IA12), then the three deep dives, DD-IA1 and DD-IA2 with search on.'
template_lede = 'What a project hub needs before the first unit is written: see the new-course skill and design/README.md.'
template_note = ''
learn_tile = ['The courses', 'Goals, outcomes, units, and the written material to read.']
build_tile = ['How the courses get made', 'Procedure, model rules, every brief, bibliography, changelog.']
# writing order: (code, model, search)
order = [
  ['IA1', 'Opus 5.5', 'off'],
  ['IA2', 'Opus 5.5', 'off'],
  ['IA3', 'Opus 5.5', 'off'],
  ['IA4', 'Opus 5.5', 'off'],
