# STATUS where the typed string is not "written <d Mon>" of the unit's front matter `written`
[pack.status]

[[pack.courses]]
key = 'IA'
name = 'Information Architecture'
color = 'var(--blue)'
slug = 'ia'
goal = "by the end of the course the reader can read any information-architecture artefact a team hands them and say what it claims and what it leaves out; choose and build the right artefact for a system of a given complexity, from a website's sitemap to a cross-surface interaction map that joins the product map to its decision trees and lifecycles; place that work inside a product development cycle with a named touchpoint for product management, engineering, content, sales, support and clients; and deliver a defensible IA when the research, the content or the stakeholders are missing, with every assumption labelled and a test named for each."
tile = 'How to read, build and edit the structure behind a product, from a sitemap to a system map, and how to deliver it when the inputs are missing.'
intro = 'For a mid-level UX designer, written to be handed on: what information architecture is, the shapes it takes, how to build it at four levels of complexity on one fictional product (Perqo: a website, an employee app, a backoffice), where it sits in the product cycle and in the business, how to validate it, and how to deliver it anyway when the research, the content or the stakeholders are missing. Twelve core units in four parts and three deep dives.'
outcomes = '<li><strong>Outcome 1</strong> — reads any IA artefact and draws one in the course notation, chooses an organisation system, and judges a structure by the behavioural evidence on scent, mental models, categories and labels (IA1, IA2, IA3, IA4; DD-IA1 reads five real products this way).</li><li><strong>Outcome 2</strong> — delivers the four Perqo IAs at rising complexity, ending in the interaction map that joins product map, decision trees and lifecycles (IA5, IA6, IA7, IA8).</li><li><strong>Outcome 3</strong> — runs IA inside a product cycle and keeps it whole: a touchpoint matrix, a validation plan with evidence, an incomplete-inputs playbook with an assumption register, and the measurement, governance and shared vocabulary that follow (IA9, IA10, IA11, IA12; DD-IA2, DD-IA3).</li>'
[[pack.courses.units]]
code = 'IA1'
title = 'What information architecture is, and where it sits'
scope = 'The definitions that hold up, the four systems, the five planes, and the lines between IA and navigation, UI, content strategy and the data model.'
deliverable = 'one-page definition sheet for a product team + the Perqo surfaces map'
aim = 'After this unit the reader can define information architecture in four published senses and hold the line between IA and navigation, the interface, content strategy and the data model.'
takes = 'nothing'
gives = 'the Perqo surfaces map (every later unit); the four systems (IA3, IA4)'
[[pack.courses.units]]
code = 'IA2'
title = 'The shapes IA takes: the artefact catalogue and the course notation'
scope = 'Every artefact from sitemap to interaction map: what each is for, who reads it, at what fidelity, and one notation for the whole course.'
deliverable = 'the course notation sheet + the artefact decision table'
aim = 'After this unit the reader can name every IA artefact, say what question it answers and who reads it at which fidelity, read one someone else made, and draw one in the course notation.'
takes = "IA1's surfaces map"
gives = "the course notation (every figure from IA3 on); the catalogue (IA9's definition of done per artefact); the decision table's 'unit that builds it' column (IA4 to IA8, DD-IA3)"
[[pack.courses.units]]
code = 'IA3'
title = 'How people find and understand things'
scope = 'Information scent and foraging, mental models, categorisation, labelling: the behavioural research a structure is judged by.'
deliverable = 'the findability and labelling checklist, applied to a Perqo navigation'
aim = "After this unit the reader can judge a structure by the behavioural evidence: whether its labels carry scent, whether it matches the user's model, how its categories will be read, and when people search rather than browse."
takes = "IA1's labelling and search systems; IA2's notation"
gives = "the criteria IA4's schemes and IA6's navigation are chosen by; the as-is Perqo app navigation IA6 replaces; the behaviour IA11's methods measure; search logs as proxy evidence (IA12)"
[[pack.courses.units]]
code = 'IA4'
title = 'Organisation systems: schemes, structures, objects, taxonomies'
scope = 'Exact and ambiguous schemes, hierarchy and polyhierarchy, faceted classification, object-oriented UX, taxonomy versus folksonomy.'
deliverable = 'the Perqo object map + a faceted taxonomy for the benefits catalogue'
aim = "After this unit the reader can choose an organisation scheme and structure for a given content set, find a product's objects before its pages, and build a faceted taxonomy with its rules."
takes = "IA3's categorisation and labelling evidence; IA1's surfaces map"
gives = 'the Perqo object map (IA6, IA7 extends it, IA8); the benefits taxonomy (IA5, DD-IA3)'
[[pack.courses.units]]
code = 'IA5'
title = 'Level 1 · the sales and product website'
scope = 'From content inventory to sitemap for perqo.com: page types, audiences, depth, and the constraints marketing and search bring.'
deliverable = 'the perqo.com content inventory and sitemap, with page templates'
aim = 'After this unit the reader can inventory a marketing site, choose its structure, and hand marketing, engineering and content a sitemap and template catalogue each can read.'
takes = "IA1's surfaces map; IA2's inventory and sitemap entries; IA3's labelling; IA4's schemes"
gives = "the perqo.com sitemap and templates (IA8's surface layer; IA10's content touchpoint; DD-IA3's localisation)"
[[pack.courses.units]]
code = 'IA6'
title = 'Level 2 · the client app'
scope = 'Task-based IA for the Perqo employee app: task inventory, app map, mobile navigation patterns, the core flows as wireflows.'
deliverable = 'the Perqo app task inventory, app map and three core wireflows'
aim = 'After this unit the reader can build a task-based app IA, choose its navigation pattern on the evidence, and draw its core flows as wireflows.'
takes = "IA4's Perqo object map; IA3's as-is navigation and checklist; IA2's wireflow entry"
gives = "the Perqo app map and three wireflows (IA8; IA11's validation plan tests this IA)"
[[pack.courses.units]]
code = 'IA7'
title = 'Level 3 · the backoffice'
scope = 'Multi-entity enterprise IA for Perqo Admin: objects, roles and permissions, list-and-detail patterns, workflows and states.'
deliverable = 'the Perqo Admin object-relationship map, role matrix, navigation model and approval state diagram'
aim = 'After this unit the reader can build a multi-entity backoffice IA: objects and relationships, roles as a layer, list-and-detail navigation, and a state diagram per lifecycle.'
takes = "IA4's Perqo object map; IA2's state diagram, matrix and navigation model entries"
gives = "the Perqo Admin IA (IA8; IA12's assumption register records its decisions; DD-IA2's business case is for Admin)"
[[pack.courses.units]]
code = 'IA8'
title = 'Level 4 · the system map'
scope = 'The cross-surface interaction map that joins the product map to the decision trees and the purchase and benefit lifecycles.'
deliverable = 'the Perqo interaction map, in layers, with its decision trees and lifecycle swimlanes'
aim = 'After this unit the reader can draw a system of several surfaces, actors and lifecycles as one layered map and read it one layer at a time.'
takes = "IA5, IA6 and IA7's Perqo IAs; IA2's blueprint and cross-surface map entries"
gives = "the Perqo interaction map (IA10's briefs are built from IA4 to IA8; DD-IA1's comparison)"
[[pack.courses.units]]
code = 'IA9'
title = 'IA in the product development lifecycle'
scope = 'Where IA work happens in discovery, definition, delivery and maintenance; agile and IA debt; definitions of done; the living document.'
deliverable = 'the IA workflow across a product cycle, with a definition of done per artefact and a maintenance cadence'
aim = 'After this unit the reader can place IA work in a product cycle, state when each artefact is done, and keep an IA current under change.'
takes = "IA2's catalogue; the Perqo artefacts of IA5 to IA8"
gives = "the IA workflow, definitions of done and maintenance cadence (IA12's loop back; DD-IA3's change control)"
[[pack.courses.units]]
code = 'IA10'
title = 'Touchpoints: what each part of the business needs from the IA'
scope = 'Product management, engineering, content and marketing, sales, customer success, support, clients, legal: the question each asks and the artefact that answers it.'
deliverable = 'the touchpoint matrix + three one-page IA briefs (product management, engineering, sales)'
aim = 'After this unit the reader can say what each function of the business asks of the IA and answer it with the right artefact at the fidelity that function can read.'
takes = "IA4 to IA8's Perqo IA; IA2's readers and fidelities"
gives = "the touchpoint matrix and three one-page briefs (DD-IA3's governance forums)"
[[pack.courses.units]]
code = 'IA11'
title = 'Validating an IA: evidence, methods, numbers'
scope = 'Card sorting, tree testing, first-click tests, search-log and analytics review, usability tests: what each proves, what it costs, how to read the results.'
deliverable = 'a validation plan for the Perqo app IA, with a tree-test script, a closed card-sort protocol and the analysis template'
aim = 'After this unit the reader can choose the method that tests a given IA question, run it cheaply, read its numbers, and say when a result is too weak to act on.'
takes = "IA6's Perqo app IA; IA3's findability evidence"
gives = "the validation plan, scripts and templates (IA12's tests per assumption; DD-IA2's measurement model)"
[[pack.courses.units]]
code = 'IA12'
title = 'When the inputs are missing: building the backbone anyway'
scope = 'Faulty or absent information, uncooperative or missing stakeholders, no content, contradictory requirements: how to still deliver a defensible IA.'
deliverable = 'the incomplete-inputs playbook: triage decision tree, assumption register, stakeholder map, decision log'
aim = 'After this unit the reader can deliver a defensible IA from proxy evidence, an assumption register, a stakeholder map and a decision log, and keep it revisable.'
takes = "IA7's Perqo Admin decisions; IA3's search logs as proxies; IA9's cadence and IA11's methods"
gives = "the incomplete-inputs playbook; the course goal's last clause"
[[pack.courses.units]]
code = 'DD-IA1'
title = 'Deep dive: five information architectures read closely'
scope = 'Five real products at rising complexity, read from their public screens and published write-ups: what shape each IA takes and why.'
deliverable = 'five IA readings in the course notation, with a comparison table'
aim = "After this unit the reader can read a real product's IA from its public screens and published write-ups, in the course notation, and say which decision shaped it."
takes = "IA2's notation; the four levels (IA5 to IA8) as the frame"
gives = 'five readings and the lessons for Perqo'
[[pack.courses.units]]
code = 'DD-IA2'
title = 'Deep dive: what IA costs and returns'
scope = 'The evidence on what bad IA costs and what good IA returns, with every number labelled; a measurement model and a business-case template.'
deliverable = 'the IA measurement model + a business-case template with sourced ranges'
aim = 'After this unit the reader can say what findability failure costs on the published evidence, measure an IA with leading and lagging indicators, and build a business case with every number labelled.'
takes = "IA7's Perqo Admin; IA11's metrics"
gives = 'the measurement model and business-case template'
[[pack.courses.units]]
code = 'DD-IA3'
title = 'Deep dive: taxonomy and governance at scale'
scope = 'Enterprise taxonomy, metadata, controlled vocabularies, ownership and change control, localisation: keeping an IA whole as the system grows.'
deliverable = 'the Perqo governance model + taxonomy change process + controlled vocabulary starter'
aim = 'After this unit the reader can tell an enterprise taxonomy from a navigation hierarchy, set ownership and change control for both, and detect drift as the system grows.'
takes = "IA4's taxonomy; IA9's change control; IA10's forums"
gives = 'the Perqo governance model, change process and controlled vocabulary'

