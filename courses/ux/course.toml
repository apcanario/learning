[[pack.changelog]]
date = '2026-11-03 07:30'
text = "v5. Syllabus review (backlog row S-1; Pedro, 3 Nov 2026, 06:35: IA3 'should make sense before IA4 and after IA2 and as a part of the course'; Fable 5.1 reviewed, Pedro approved every edit). Every unit gains an Aim (what the reader can do after it), Takes (the filed units it builds on) and Gives (what later units take from it), printed in every open brief between the preamble and the unit brief and on every unit card (units_data.py AIMS; kit/mdcourse.py open_brief). Four briefs gain one closing sentence each to close two seams: IA3's as-is Perqo app navigation is the structure IA6 replaces, and IA6 keeps the labels IA3's checklist passed; IA4's object map covers the whole product and IA7 extends it for Admin, renaming nothing. IA9's brief points forward to IA11 rather than back. IA3's scope line reads 'the behavioural research a structure is judged by' (its old line described IA11's job). Spencer (2nd ed., 2014) and Hedden (3rd ed., 2022) get their edition and year in the preamble. The three outcomes are rewritten so each unit, the deep dives included, sits under the outcome it serves. The order note says where the audits fall (after Parts 1, 2 and 4; Parts 3 and 4 share one). A register of Perqo's invented facts, generator/data/ux/perqo-facts.md, starts from IA1 and IA2 and is appended at every filing. IA1 and IA2 are unchanged; IA3 is next, from its brief as it now reads."
[[pack.changelog]]
