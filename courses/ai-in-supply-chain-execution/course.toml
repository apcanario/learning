# ai-in-supply-chain-execution: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The sixth public course (designed 21 Nov 2026 on Fable 5.2, filed 23 Nov 2026 by row S-AIE0; docs/ai-in-supply-chain-execution-syllabus.md):
# written for anyone who builds, sells or implements order, warehouse or transport software and knows the ground of the track's first
# course, adapted from nothing, the third course of the Supply Chain track. Like supply-chain-execution: no source units, a seed
# bibliography, its own prompts document. `dated_lists = true` tells kit/private_terms.py that its pages may name the owner's employer
# as one entry of a dated analyst list, and nowhere else (syllabus section 6; syllabus flag F1), as for the track's other two courses.
# Registry keys copied from courses/supply-chain-execution/course.toml and changed as the design's units.toml header says; the [pack]
# table is that file's data, with the keys the schema needs filled in the Execution course's form. `reliefs` is not set: the outlines
# wait for row G-R-AIE (syllabus decision D12, proposal P-AIE6).

