# building-with-ai: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The public courses (11 Nov 2026, backlog row G-0; docs/public-courses.md): adapted from the private course's A and B for
# any reader, each in its own data folder and vault so the private courses can move to a private site later. Each sits
# in the same track as its private original for now. No private term may reach either (kit/private_terms.py).

id = "building-with-ai"
family = "markdown"
short = "Building with AI (public)"
label = "BUILDING WITH AI"
name = "Building with AI"
color = "var(--purple)"
home_id = "building-with-ai"
status = "in progress"
tracks.BW = ["technology", "Building with AI · public"]
tiles.BW = "A working method for building a real project with AI."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/building-with-ai/course.toml"
vault = "courses/building-with-ai"
sourcing_part = "Part 6"
eyebrow = "BUILDING WITH AI"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (case and syllabus-flags
# files). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed string
# differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top changelog row).
[pack]
course_note = "Every unit is sourced to peer-reviewed work, vendor documentation or a practitioner's own words, grades each method by its evidence, dates every product fact, says what holds only for one tool, and ends with a deliverable built in full on a real project and then as a template."
order_lede = 'One row per unit in writing order, which is the reading order. Opus 5.5 writes; a fresh Opus 5.5 context checks each unit before filing. "Search" means the unit is written with web search on because its facts are current.'
order_foot = 'The count starts at {start}.'
# not read by any kit/ script (the v5.1 standalone hub's identity and tiles); kept as the record. TEMPLATE_BLOCKS was [].
title = 'Building with AI'
bar = 'BUILDING WITH AI'
brand_html = 'BUILDING <span>/</span> WITH AI'
out = 'building-with-ai.html'
theme_key = 'building-with-ai-theme'
learn_c = 'var(--purple)'
build_c = 'var(--orange)'
home_lede = 'A working method for people who already think well and want to build a real project with AI: brief, structure, specify, verify, automate. Every claim sourced.'
home_h1 = 'Building with AI'
learn_note = 'Order of writing: the ten core units in reading order, BW1 to BW10, then the three deep dives, DD-BW3 last; BW1, BW2, BW5, BW9, BW10 and DD-BW1 with search on.'
template_lede = 'What a course needs before the first unit is written: see the new-course skill and design/README.md.'
template_note = ''
learn_tile = ['The course', 'Goal, outcomes, units, and the written material to read.']
build_tile = ['How the course gets made', 'Procedure, model rules, every brief, bibliography, changelog.']
# writing order: (code, model, search)
order = [
  ['BW1', 'Opus 5.5', 'on'],
  ['BW2', 'Opus 5.5', 'on'],
  ['BW3', 'Opus 5.5', 'off'],
  ['BW4', 'Opus 5.5', 'off'],
