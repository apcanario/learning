  ['DD-BW3', 'Opus 5.5', 'off'],
]

# STATUS where the typed string is not "written <d Mon>" of the unit's front matter `written`
[pack.status]

[[pack.courses]]
key = 'BW'
name = 'Building with AI'
color = 'var(--purple)'
slug = 'bw'
goal = 'by the end of the course you can say what the model saw when an output fails; brief a task so that the first output is usable and keep a project structure that does not rot; verify AI-written work by sample before you trust it; and decide what to hand to an agent, with one real project of your own specified and running.'
tile = 'A working method for people who already think well and want to build a real project with AI: brief, structure, specify, verify, automate. Every claim sourced.'
intro = 'For an experienced professional who reasons and writes well and uses a chat assistant with no method: how the tool works, which model for which task, how to brief, how to structure and specify a project, how to verify what the machine wrote, how to chain, automate and delegate the work, and what it costs. Principles stated for any assistant, worked on Claude with every product fact dated, and on one real project, Academy, with its own error counts. Ten core units in three parts and three deep dives.'
outcomes = '<li><strong>Outcome 1</strong> — a working model of the tool and a routing table with cost (BW1, BW2, BW10).</li><li><strong>Outcome 2</strong> — a specified project that produces usable first outputs (BW3, BW4, BW5, BW8; DD-BW1 sets it beside the documented methods).</li><li><strong>Outcome 3</strong> — a verification protocol, a pipeline and an agent rule, run on your own project (BW6, BW7, BW9; DD-BW2 and DD-BW3).</li>'
[[pack.courses.units]]
code = 'BW1'
title = 'Mental model'
scope = 'The context window, tokens as cost and attention, what persists and what does not, trained against retrieved knowledge, why the same prompt answers differently.'
deliverable = 'the five-minute model + a table for diagnosing a failed output'
aim = 'say what the model could see when an output fails, and what to change'
takes = 'B1 as source material'
gives = 'the vocabulary every later unit uses; the diagnosis table BW3, BW4 and BW6 point back to'
[[pack.courses.units]]
code = 'BW2'
title = 'Choosing the model and the effort'
scope = 'Cost per task, when the small model is the right one, what effort settings do; the method in the unit and the lineup in a dated appendix.'
deliverable = 'routing table for ten common project tasks'
aim = 'route each recurring task of your project to a model tier and an effort level, with the reason'
takes = 'B2 as source material; its lineup and prices are re-read, not carried over; BW1'
gives = 'the routing table BW7 assigns stages from and BW10 budgets'
[[pack.courses.units]]
code = 'BW3'
title = 'Briefing: prompts that hold up'
scope = 'The four parts of a brief that survives, output contracts, negative examples, and the common ways an ask fails.'
deliverable = 'ten brief templates, each with a worked example'
aim = 'brief a task so that the first output is usable'
takes = 'B3 as source material; its ten templates are replaced by ten for general project work; BW1, BW2'
gives = 'the brief form BW5 uses per unit, the checker brief BW6 builds and the stage briefs of BW7'
[[pack.courses.units]]
code = 'BW4'
title = 'Context engineering'
scope = 'Instructions, files, memory, skills, connectors: what belongs where, what loads every turn, when to start a new chat, how a project rots.'
deliverable = 'project-structure template + rot check'
aim = 'lay out a project so that the model is told what it needs each turn and nothing stale'
takes = 'B4 as source material; its audit is summarised in the Academy case file; BW1, BW3'
gives = 'the project structure BW5 specifies into and BW8 automates'
[[pack.courses.units]]
code = 'BW5'
title = 'Specifying a project'
scope = 'From idea to spec to build order: units of work one context can finish, a definition of done, a decision log, and how a spec changes.'
deliverable = 'one-page spec + build order + unit-brief template'
aim = 'turn an idea into a one-page spec and a build order that one context per unit can finish'
takes = 'DD-B3, its spec-driven section, and docs/method.md as source material; this unit has no counterpart in the private course; BW3, BW4'
gives = 'the spec and build order every later deliverable is built against; the flag-and-review rule BW7 and BW9 rely on'
[[pack.courses.units]]
code = 'BW6'
title = 'Research and verification'
scope = 'Ask, search or deep research, with cost and time; how models fail; how to read a research report; sampling before trusting.'
deliverable = 'verification protocol with a sampling rule'
aim = 'verify AI-written work by sample before you trust it, and know what a clean sample proves'
takes = 'B6 as source material; BW1, BW2, BW3, BW5'
gives = 'the checker brief BW8 turns into a skill; the verifiability test BW9 uses to decide what to delegate'
[[pack.courses.units]]
code = 'BW7'
title = 'Pipelines: raw material to finished output'
scope = 'Chaining steps, routing each to a model, where a model helps a writer and where it flattens a voice, and the rule that the final pass is human.'
deliverable = 'a pipeline as a runnable procedure'
aim = "write your project's repeated work as a pipeline with a model per stage and a human gate"
takes = 'B7 as source material, for its studies and its pipeline form only; BW2, BW3, BW5, BW6'
gives = 'the procedure BW8 automates and BW9 hands in part to an agent'
[[pack.courses.units]]
code = 'BW8'
title = 'Skills and automation'
scope = 'What a skill is, why its description carries the trigger, scheduled tasks and their limits, and when a procedure is worth automating.'
deliverable = 'one skill written in full, with a trigger test set'
aim = 'write one reusable skill for your project and test that it triggers'
takes = 'B5 as source material; its deliverable is replaced; BW4, BW6, BW7'
gives = "the skill form BW9's agents load"
[[pack.courses.units]]
code = 'BW9'
title = 'Agents'
scope = 'Agent against chat, the autonomy slider, what agents do well and what they quietly wreck, and the guardrails.'
deliverable = 'agent-use decision rule + guardrail checklist'
aim = 'decide which tasks to hand to an agent and with what guardrails'
takes = 'DD-B1 as source material; BW5, BW6, BW7, BW8'
gives = "the decision rule DD-BW1's methods are tested against; the agent rules BW10 costs"
[[pack.courses.units]]
code = 'BW10'
title = 'Cost, limits, privacy'
scope = 'What a plan measures, what burns usage for no gain, when a new chat is cheaper, and what the vendor keeps.'
deliverable = 'usage rules + a table of what material belongs where'
aim = "keep a project inside its plan's limits and keep the wrong material out of the tool"
takes = 'B8 as source material; every limit, price and retention fact is re-read; BW1, BW2, BW4, BW9'
gives = "the usage rules DD-BW3 tests against a reader's own record"
[[pack.courses.units]]
code = 'DD-BW1'
title = 'Deep dive: how the best practitioners work'
scope = 'The documented methods that have a named author and a primary source, each graded by its evidence and tested for transfer from code to knowledge work.'
deliverable = 'method cards + ten operating rules'
aim = 'name the documented methods worth adopting, with the evidence each rests on'
takes = 'DD-B3 as source material; BW1 to BW10'
gives = 'the operating rules DD-BW3 tests'
[[pack.courses.units]]
code = 'DD-BW2'
title = 'Deep dive: one project, with its numbers'
scope = "What the Academy case built, its error counts at first check, what each audit caught and what failed in operation, taken from the project's own records."
deliverable = 'the case report + a ranked list of changes the record supports'
aim = "read one real project's record and say which of the course's rules its numbers support"
takes = 'the Academy case file and the records its row stages (fresh-check reports, audit reports, the changelog), private details removed; B6, for its count of first drafts with an error; BW1 to BW10'
gives = "the worked record DD-BW3 sets a reader's own review beside"
[[pack.courses.units]]
code = 'DD-BW3'
title = 'Deep dive: audit your own usage'
scope = "A method for classifying your own chats by task, model, outcome and turns, with one person's findings as the worked example."
deliverable = 'gap-report template + a sixty-minute procedure'
aim = 'review your own chats and write the ten changes that would save you the most'
takes = 'DD-B2 as source material, for its method and its counts only, every personal detail removed; BW10, DD-BW1, DD-BW2'
gives = "nothing; it is the course's last unit"

