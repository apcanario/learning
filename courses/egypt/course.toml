[[pack.courses]]
key = 'EG'
name = 'Egyptian history and mythology'
color = 'var(--gold)'
slug = 'eg'
goal = "To know ancient Egypt from the first kings to the closing of the last temple, its history, its gods and its dead, well enough to place any monument, text or claim in its period and to say what kind of evidence it rests on."
tile = "Ancient Egypt from the first kings to the closing of the last temple: its history, its gods and its dead, told from Egyptian evidence first, every claim sourced to an opened text and graded."
intro = "Ancient Egypt from the first kings to the closing of the last temple, told from Egyptian evidence first and from Greek and Roman observers second, with every claim sourced to an opened text and graded on the seven-grade key EG1 sets. Fifty-seven core modules in twelve syllabus units, then three deep dives of seven modules each: the pyramids, Amarna, and the afterlife books. The third course of Personal Mythology, after Greece and Rome, which it points back to."
outcomes = "<li><strong>Outcome 1.</strong> Place any king, monument or text within its period and dynasty, and say how firm the date is; measured by EG57's examination, sections 1 and 2, and the anchor-date table of EG3 from memory (EG2 to EG35).</li><li><strong>Outcome 2.</strong> Give the main gods, the creation accounts, the Osiris cycle and the afterlife as Egyptian sources state them, naming the earliest source for each element; measured by EG57, section 3, and the source table of EG39 (EG36 to EG49, DD-EG15 to DD-EG21).</li><li><strong>Outcome 3.</strong> Grade a claim about Egypt on the seven-grade key, and name what would change the grade; measured by EG57, section 4, and the claims audit of DD-EG7 (EG1, EG31, EG56, DD-EG1 to DD-EG14).</li><li><strong>A fourth, smaller outcome.</strong> Read a royal cartouche and the offering formula on sight (EG53, EG54).</li>"
