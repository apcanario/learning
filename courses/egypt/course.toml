# egypt: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The third course of Personal Mythology, after Greece and Rome (designed 21 Nov 2026 on Fable 5.2, filed 23 Nov 2026 by row
# S-EG0; docs/egypt-syllabus.md): private, read by the Project's own reader (docs/reader.md), on the History track. Unlike
# Greece and Rome it is a markdown course (skills/new-course §1, P71; syllabus decision D6), not the history family's
# courses/<id>/inputs/ form: its modules are filed as courses/egypt/<code>-<slug>.md and Academy reads them through
# kit/pack.py. Like the public courses since sport-psychology: no source units, a seed bibliography (notes/bibliography.md),
# its own prompts document. Codes EG1 to EG57 and DD-EG1 to DD-EG21 (syllabus D7), not the dotted unit.module form.
# Registry keys copied from courses/ai-in-supply-chain-execution/course.toml and changed for this course, plus `private` and
# `family_label` as Rome's has them. The [pack] table is the syllabus's sections 2 to 5 and 8 in the AI course's form: the
# design gives each module a Takes line but no Aim or Gives line (kit/pack.py needs all three beside each other), so Aim
# repeats the syllabus's one-line scope and Gives the brief's Deliverable. kit/pack.py has no part field, so the fifteen
# syllabus units are in pages/order-notes.md. `reliefs` is not set: the outlines wait for row G-R-EG (override 2 of row
# S-EG0; syllabus proposal P-EG6).

id = "egypt"
family = "markdown"
private = true   # S-DEC4, for kit/verify.py: the owner's own course, not public, like Greece and Rome
family_label = "Personal Mythology"   # as Greece and Rome have it (S-DEC5 checker)
short = "Egypt"
label = "EGYPT"
name = "Egyptian history and mythology"
color = "var(--gold)"
home_id = "egypt"
status = "in progress"
tracks.EG = ["history", "Egypt"]
tiles.EG = "Ancient Egypt from the first kings to the closing of the last temple: its history, its gods and its dead, told from Egyptian evidence first, every claim sourced to an opened text and graded."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/egypt/course.toml"
vault = "courses/egypt"
sourcing_part = "Part 12"
source_units = false
# kit/next_prompt.py prints this course's rows from the template there
prompts_doc = "docs/egypt-prompts.md"
eyebrow = "EGYPT"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (bibliography, syllabus-flags
# and names files). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed string
# differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top changelog row).
[pack]

course_note = "Every module is sourced to Egyptian texts in named, opened translations, objects by museum and accession number, classical authors by book and chapter, peer-reviewed articles, academic monographs, the UCLA Encyclopedia of Egyptology, excavation reports and museum records, each opened before it is cited and logged; grades every claim (attested, later tradition, consensus, contested, scientific, announced, conjecture); gives every date before 664 BC as approximate with its chronology; cites no translation by Budge; and ends with its deliverable, then the Self-test and Carry forward."
order_lede = "One row per module in writing order, which is the code order: EG1 to EG57, then DD-EG1 to DD-EG21. Opus 5.5 writes; a fresh Opus 5.5 context checks each module before filing. Every writer searches to open its sources; \"Search on\" means the module states facts that can change and owes the six-month staleness check."
order_foot = 'The count starts at {start}.'
