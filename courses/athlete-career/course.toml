# athlete-career: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The seventh public course (designed 21 Nov 2026 on Fable 5.2, filed 23 Nov 2026 by row S-AC0; docs/athlete-career-syllabus.md):
# written for a coach who also sponsors an athlete they coach through a business of their own, helps them unpaid as representative,
# or both, adapted from nothing, the second course of the Sports track. Like sport-psychology and supply-chain-execution: no source
# units, a seed bibliography, its own prompts document. Its case is Sport Psychology for Coaches' three athletes with a commercial
# layer (proposal P-AC1; that course's register wins on any conflict). `dated_lists` is not set: the course names no software vendor.
# Registry keys copied from courses/supply-chain-execution/course.toml and changed for this course; the [pack] table is the design's
# docs/athlete-career-units.toml and syllabus sections 1 to 5, with the keys the schema needs filled in the Execution course's form.
# The design gives no Takes or Gives line (kit/pack.py needs both beside an Aim): Takes names the units before it in writing order
# (the preamble: each unit assumes the ones before it), Gives repeats the design's Ships line. `reliefs` is not set: the outlines
# wait for row G-R-AC (override 2 of row S-AC0).

id = "athlete-career"
family = "markdown"
short = "Managing an Athlete's Career (public)"
label = "ATHLETE'S CAREER"
name = "Managing an Athlete's Career"
color = "var(--gold)"
home_id = "athlete-career"
status = "in progress"
tracks.AC = ["sports", "Athlete's career · public"]
tiles.AC = "Funding, sponsors, contracts and the career after sport, for the coach who also sponsors or represents the athlete."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/athlete-career/course.toml"
vault = "courses/athlete-career"
sourcing_part = "Part 11"
source_units = false
# kit/next_prompt.py prints this course's rows from the template there
prompts_doc = "docs/athlete-career-prompts.md"
eyebrow = "ATHLETE'S CAREER"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (case and syllabus-flags
# files). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed string
# differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top changelog row).
# The design gave each unit a `part` key; kit/pack.py has no part field, so the parts are in pages/order-notes.md.
[pack]
course_note = "Every unit is sourced to peer-reviewed research, rule-makers' own texts, legislation and official guidance at the issuing body's page, court judgments, funders' and organisers' own figures and surveys, grades every claim (research, rule, data, interested party, practice), states no rule as the reader's, gives no legal, tax or financial advice, assesses no real agent, agency or sponsor, and ends with a deliverable built in full on the fictional case and then as a template."
order_lede = 'One row per unit in writing order, which is the reading order but for the deep dives (DD-AC2 is written before DD-AC1). Opus 5.5 writes; a fresh Opus 5.5 context checks each unit before filing. "Search" means the unit is written with web search on because its facts are current.'
order_foot = 'The count starts at {start}.'
# not read by any kit/ script (the v5.1 standalone hub's identity and tiles); kept as the record. TEMPLATE_BLOCKS was [].
title = "Managing an Athlete's Career"
bar = "ATHLETE'S CAREER"
brand_html = "MANAGING <span>/</span> AN ATHLETE'S CAREER"
out = 'athlete-career.html'
theme_key = 'athlete-career-theme'
learn_c = 'var(--gold)'
build_c = 'var(--orange)'
home_lede = "For the coach of an athlete in an Olympic or federation sport who also sponsors the athlete through a business of their own, helps them unpaid as representative to other sponsors and funders, or both: the rules that bind what the athlete may sell, funding and the season's money, sponsorship from both seats, contracts and agents as questions, and the career alongside and after sport, with the conflict between the roles declared and managed in writing. Every claim sourced and graded."
home_h1 = "Managing an Athlete's Career"
learn_note = 'Order of writing: the fifteen core units in reading order, AC1 to AC15, then DD-AC2, DD-AC1 and DD-AC3; every unit with search on but AC6, AC7, AC10 and AC15.'
template_lede = 'What a course needs before the first unit is written: see the new-course skill and design/README.md.'
template_note = ''
learn_tile = ['The course', 'Goal, outcomes, units, and the written material to read.']
build_tile = ['How the course gets made', 'Procedure, model rules, every brief, bibliography, changelog.']
