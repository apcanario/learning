[[pack.courses]]
key = 'A'
name = 'Building a Marketable Personal Brand'
color = 'var(--teal)'
slug = 'brand'
goal = 'by the end of the course the reader can state, in one sentence, who his audience is and what they pay for; run a publishing system that holds a bi-weekly cadence inside 5–7 h/week for twelve months; and read his own channel metrics against sourced benchmarks to decide, with evidence, whether to continue, change format or stop.'
tile = 'Who pays, for what, how long it takes, what it costs in hours, and what the record-as-brand changes.'
intro = 'Not "how to be an influencer": who pays, for what, how long it takes, what it costs in hours, and what the record-as-brand changes about all of it. Nine core units and two deep dives.'
outcomes = '<li><strong>Outcome 1</strong> — a positioning a stranger can repeat, tested against five sourced comparables (A1, DD-A1).</li><li><strong>Outcome 2</strong> — a publishing system that holds bi-weekly for twelve months inside the hour budget (A3, A5, A8).</li><li><strong>Outcome 3</strong> — a metrics sheet and benchmark table he reads quarterly to decide continue / change format / stop (A6, A9, A7, DD-A2).</li>'
[[pack.courses.units]]
code = 'A1'
title = 'Positioning: the journey as a format'
scope = 'The one sentence a stranger can repeat; the journey template (consumed → syllabus → process → record → artefact); tested against vlog ep. 1–2 and five creators who built a brand on a method rather than a topic.'
deliverable = 'positioning statement + channel rename + description'
[[pack.courses.units]]
code = 'A2'
title = 'Audience and platform economics'
scope = 'Who the 30–45 restless-brain audience is, where they are, what converts them; why YouTube long-form compounds; where the written archive lives.'
deliverable = 'audience profile + platform allocation'
[[pack.courses.units]]
code = 'A3'
title = 'The journey system'
scope = 'How a journey becomes content: capture during (dictated takes, journal, Zepp), recap after, one long-form per milestone, three posts a week from the same material. Season structure: Athens → HM → history → next.'
deliverable = 'journey template + 12-week calendar for the three live journeys'
[[pack.courses.units]]
code = 'A4'
title = 'Voice, disclosure and the record'
scope = 'Honest on camera without a confessional channel. ADHD is public; the line for everything else. How the record stays truthful so it is usable as evidence later.'
deliverable = 'disclosure policy (pre-mortem attached) + record rules'
[[pack.courses.units]]
code = 'A5'
title = 'Production craft'
scope = 'Filming inside a training session, audio, thumbnails in the Shōmen stylesheet, titles that are not clickbait, editing in under 4 h.'
deliverable = 'production checklist + edit template'
[[pack.courses.units]]
code = 'A6'
title = 'How growth works, per platform'
scope = 'YouTube: search vs browse, retention and CTR, why long-form compounds. Instagram: reach is rented, Reels discover, feed serves followers. Substack/own site: slow but owned.'
deliverable = 'per-platform playbook + metrics sheet'
[[pack.courses.units]]
code = 'A7'
title = 'Monetisation through Shōmen'
scope = 'Brand → commerce without the channel becoming an advert. Product placement that is just him wearing the gi. Sponsorship stories as episodes.'
deliverable = 'Shōmen integration plan + 2027 revenue model'
[[pack.courses.units]]
code = 'A8'
title = 'Legal, tax, time'
scope = 'Portuguese side-income rules, Infios contract constraints on public activity, image rights of training partners and minors, time budget against the rebuild.'
deliverable = 'constraints register'
[[pack.courses.units]]
code = 'A9'
title = 'What to expect: benchmarks'
scope = 'Realistic numbers for a one-person, bi-weekly channel: 0→1k, 1k→10k, 10k→50k, months to each, share of followers who ever buy, the plateau and why most quit there.'
deliverable = 'expectation sheet + quarterly checkpoints'
[[pack.courses.units]]
code = 'DD-A1'
title = 'Deep dive: five creators who did this'
scope = 'Working-athlete and masters-athlete channels, learning-in-public channels, and ADHD-with-achievement creators that converted into a product or a living. Year one, what they stopped doing.'
deliverable = 'comparables brief'
[[pack.courses.units]]
code = 'DD-A2'
title = 'Deep dive: the exit math'
scope = 'What income, over how many months, would make a non-9-to-5 life survivable for a sole earner. A floor calculation; written last.'
deliverable = 'threshold model'

[[pack.courses]]
key = 'B'
name = 'Using AI to Build a Brand'
color = 'var(--purple)'
slug = 'ai'
goal = 'by the end of the course the reader routes each recurring task to the right model and effort level without guessing; briefs any unit, draft or audit so that the first output is usable; keeps a project structure that does not rot; and verifies AI-written material by sampling before trusting it.'
tile = "Which model for which task, how to brief, where the setup leaks, and what he doesn't know he's doing badly."
intro = 'Not how LLMs work. Which model for which of his tasks, how to brief so he stops re-explaining, where the project setup leaks, and what he does not know he is doing badly. Eight core units and three deep dives.'
outcomes = '<li><strong>Outcome 1</strong> — a model-routing table for every recurring task, with cost and effort (B1, B2).</li><li><strong>Outcome 2</strong> — a prompt library and a project structure that produce usable first outputs (B3, B4, B5, DD-B3).</li><li><strong>Outcome 3</strong> — a verification protocol and a content pipeline, both run on real work before the course ends (B6, B7, B8, DD-B1).</li>'
[[pack.courses.units]]
code = 'B1'
title = 'Mental model'
scope = "Context window, tokens, what a model retains and does not, why 'it forgot' is usually 'it was never told'. Where the memory system fits."
deliverable = 'one-page model he can explain in five minutes'
[[pack.courses.units]]
code = 'B2'
title = 'Choosing the model'
scope = 'The current lineup: Haiku for triage, Sonnet for drafting, Opus for long-form, Fable for audit. Cost per task, not per token.'
deliverable = 'model-routing table for his recurring tasks'
[[pack.courses.units]]
code = 'B3'
title = 'Prompting that holds up'
scope = "Role, constraints, examples, output contract. Why the preferences file works and one-line asks sometimes don't. Negative examples."
deliverable = 'prompt library, 10 templates for his real tasks'
[[pack.courses.units]]
code = 'B4'
title = 'Context engineering'
scope = 'Projects, memory, skills, what goes where. Why file temperatures exist. When to start a new chat.'
deliverable = 'project-structure audit + fixes'
[[pack.courses.units]]
code = 'B5'
title = 'Skills and automation'
scope = 'How plugin skills fire, how to write one, scheduled tasks, where the vault and pcblueprint plug in.'
deliverable = 'one new skill written by him for the brand workflow'
[[pack.courses.units]]
code = 'B6'
title = 'Research and verification'
scope = 'Search vs deep research vs asking directly. How models fail (confident, specific, wrong). The stratified-sample audit, generalised.'
deliverable = 'verification protocol'
[[pack.courses.units]]
code = 'B7'
title = 'Content pipeline'
scope = 'Dictated take → script → titles → thumbnail copy → post variants, model-routed. Where AI helps his voice and where it flattens it.'
deliverable = 'the pipeline, wired, used on the Athens edit'
[[pack.courses.units]]
code = 'B8'
title = 'Cost, limits, hygiene'
scope = 'Plan limits, token budgets, what burns usage for no gain. Privacy of what is stored.'
deliverable = 'usage rules added to way-of-working'
[[pack.courses.units]]
code = 'DD-B1'
title = 'Deep dive: agents'
scope = 'Claude Code, subagents, Strider and AIssistant as cases. What an agent is good for, what it quietly wrecks.'
deliverable = 'agent-use decision rule'
[[pack.courses.units]]
code = 'DD-B2'
title = 'Deep dive: his unknown unknowns'
scope = 'Written last. A review of 90 days of chats in this project: where he asked badly, where the tool was wrong for the job, where he did by hand what a skill already does.'
deliverable = 'personal gap report'
[[pack.courses.units]]
code = 'DD-B3'
title = 'Deep dive: how the best practitioners use the tool'
scope = "Karpathy's documented practice 2025–26 (vibe coding, Software 3.0, agent-first coding, autoresearch, the LLM Knowledge Base) and every other method with a named author and a primary source: Anthropic's and OpenAI's own guides, Willison, Mollick, spec-driven workflows, the chain-of-thought literature. What is verified, what is folklore, what transfers from code to his work."
deliverable = 'method cards + his operating rules'

# READINGS that are not a unit's (md is relative to notes/); a unit's intro is its front matter
[[pack.readings]]
id = 'read-audience-growth'
md = 'audience-growth-across-platforms.md'
course = 'A'
title = 'Audience growth across platforms (research, superseded)'
covers = []
name = 'Audience growth (research)'
intro = 'Superseded on 28 Oct 2026 by the A9, A2 and A6 units, after Audit 1 found 23 of 91 claims failing and the deliverables missing; kept as the record. Research run 27 Oct 2026 across five tracks (YouTube mechanics; Instagram and TikTok; platform strategy; retention and conversion; niche landscape). It stands as the written material for A2, A6 and A9 and feeds A4 and A7. Most figures are correlational and vendor-published; the text says so where it applies. Gaps: no measured calendar-time-to-milestone data, no short-form→long-form conversion rate, no primary newsletter churn, no Portuguese-language RPM or SEO data; the YPP February 2027 threshold is cited via AIR, not verified against YouTube Help.'

