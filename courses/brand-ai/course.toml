# brand-ai: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).

id = "brand-ai"
family = "markdown"
short = "Brand + AI"
label = "BRAND + AI"
name = "Brand + AI: two courses for one reader"
color = "var(--teal)"
home_id = "brand-ai"
status = "in progress"
# panel ids brand-a, brand-b (a new markdown course defaults to its id)
prefix = "brand"
# keeps #briefs-a and #b-a2 from A3; a new course gets #<id>-<key>-briefs, #<id>-<key>-b-<code>
legacy_ids = true
# each course in the data file's COURSES becomes its own Academy course: key -> [track, short name for the top bar and drawer]
tracks.A = ["marketing", "Personal brand"]
tracks.B = ["technology", "Building with AI"]
# P90: each course's one sentence on the home card, two lines at most (the data file's longer tile stays on its pages)
tiles.A = "Who pays, for what, how long it takes, and what the record-as-brand changes."
tiles.B = "Which model for which task, how to brief, and where the setup leaks."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/brand-ai/course.toml"
# the filed units (method.md §7); a unit is written when its file is here (A5)
vault = "courses/brand-ai"
eyebrow = "BRAND + AI"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (the research and the
# v5.1 briefs). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed
# string differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top
# changelog row). A1's title is the one the old hub substituted into units_data.py ("Personal Mythology" -> "the journey").
[pack]
course_note = 'Not content for its own sake: every unit is sourced to peer-reviewed, platform-official or large-sample data, labels anecdote and vendor data as such, and ends with a shipped deliverable.'
order_lede = 'One row per unit in writing order. Opus 5.5 writes; a fresh context checks each unit before filing. The last deep dive was briefed for Fable 5.1 because it reviews the chat history; Pedro set that exception aside on 31 Oct 2026 and it was written by Opus 5.5 with the past-chat tools. "Search" means the unit is written with web search on because its facts are current.'
order_foot = 'A2, A6 and A9 are already written as the audience-growth research, which is why the count starts at {start}.'
# not read by any kit/ script since A3 (the v5.1 standalone hub's identity and tiles); kept as the record
title = 'Brand and AI Courses'
bar = 'BRAND + AI'
brand_html = 'BRAND <span>+</span> AI'
out = 'brand-and-ai-courses.html'
theme_key = 'hub-theme'
learn_c = 'var(--red)'
build_c = 'var(--orange)'
home_lede = 'Two courses for one reader, written one unit at a time. <strong>Learn</strong> is where the finished units are read. <strong>Build</strong> is where they get made: method, briefs, sources, history.'
home_h1 = 'Brand + AI: two courses'
learn_note = 'Order of writing: B1–B4 first, then A1, DD-B3, A3, A4, A5, A7, A8 with B5–B8 interleaved (B5 beside A3, B7 beside A5), then the four deep dives; DD-A2 and DD-B2 last. The history course keeps its own slot.'
template_lede = "What a project hub needs before the first unit is written. Copy this page's structure (the generator scripts are in the zip); change the content. Three requirement sets: the website, the syllabus, the AI rules."
learn_tile = ['The courses', 'Goals, outcomes, units, and the written material to read.']
build_tile = ['How the courses get made', 'Procedure, model rules, every Opus brief, bibliography, changelog.']
# writing order: (code, model, search)
