# STATUS where the typed string is not "written <d Mon>" of the unit's front matter `written`
[pack.status]

[[pack.courses]]
key = 'SP'
name = 'Sport Psychology for Coaches'
color = 'var(--orange)'
slug = 'sp'
goal = "by the end of the course you can adjust what you ask of an athlete to their age and stage; teach a small set of evidence-graded psychological skills in practice and use them on competition day; respond to an athlete's state from their baseline and their own words; keep your language, your handling of weight and your authority on the right side of a line you can state; and recognise the signs that mean referral, with a season plan written for your own squad."
tile = "For coaches of athletes aged 10 to 25: how young athletes develop, how to teach mental skills that hold under pressure, how to respond on the day, and where a coach's part ends. Every claim sourced and graded."
intro = "For a coach in any sport with no training in psychology: what changes in an athlete between 10 and 25, the climate your own behaviour creates, what anxiety is and how it is kept going, the skills a coach may teach and how strong the evidence is for each, training under pressure, reading and responding to an athlete, competition day, the signs that mean referral, and a season plan. Three deep dives: the coach's line with minors, weight and who decides, and the techniques an athlete carries into competition. Worked on three fictional athletes in three sports. Ten core units in four parts and three deep dives."
outcomes = "<li><strong>Outcome 1 · Know the athlete and the evidence.</strong> An age-and-stage table, a climate audit of your own coaching, and a claim-check you can run on anything you are told (SP1, SP2, SP3).</li><li><strong>Outcome 2 · Skills in practice and on the day.</strong> An anxiety profile, a skills block, a pressure-training block, a response table, a competition-day protocol, a pocket toolkit and a season plan (SP4 to SP8, SP10, DD-SP3).</li><li><strong>Outcome 3 · Wellbeing and the coach's line.</strong> A red-flag table and referral plan, a conduct code and comment test, and a protocol for who decides a weight class (SP9, DD-SP1, DD-SP2).</li>"
[[pack.courses.units]]
code = 'SP1'
title = 'What a coach can do, and how to tell evidence from noise'
scope = "The coach's part and where it ends, how to read a study, the evidence grades, and the popular claims that do not hold."
deliverable = 'scope-of-practice card + claim-check sheet + the grade key'
aim = 'say what is yours to do as a coach and what is not, and grade any claim about the mind in sport by its evidence'
takes = "nothing; it is the course's first unit"
gives = 'the scope line and the grade key every later unit uses; the claim-check sheet the reader keeps'
[[pack.courses.units]]
code = 'SP2'
title = 'The developing athlete, 10 to 25'
scope = 'Three clocks (age, maturation, training age), what is and is not known about the adolescent brain, sleep, identity, and early success.'
deliverable = 'age-and-stage table + an athlete development note'
aim = 'adjust what you ask of an athlete to their age, maturation and training age'
takes = 'SP1'
gives = 'the age bands and the development note SP3 to SP10 build on; the maturation evidence DD-SP2 relies on'
[[pack.courses.units]]
code = 'SP3'
title = 'Motivation and the climate you create'
scope = 'Autonomy, competence and relatedness; task and ego climates; controlling and autonomy-supportive coaching; enjoyment, dropout and burnout.'
deliverable = "climate self-audit + three session rewrites + a parents' page"
aim = 'see the climate your own behaviour creates and change three things in it'
takes = 'SP1, SP2'
gives = "the autonomy-supportive and controlling behaviours SP7 decides by and DD-SP1 draws its line through; the parents' page SP8 and SP10 extend"
[[pack.courses.units]]
code = 'SP4'
title = 'Anxiety, arousal and performing under pressure'
scope = 'What anxiety is and is not, what the data show about anxiety and performance, attention under pressure, and how nerves become a years-long problem.'
deliverable = 'athlete anxiety profile + a normal-or-refer table'
aim = "describe one athlete's competition anxiety precisely, and tell ordinary nerves from a problem that needs a clinician"
takes = 'SP1, SP2, SP3'
gives = 'the anxiety profile SP5, SP6 and SP8 work from; the normal-or-refer table SP9 completes; the attention account DD-SP3 uses'
[[pack.courses.units]]
code = 'SP5'
title = 'The cognitive-behavioural toolkit'
scope = 'The model in plain words and the skills a coach may teach: goals, self-talk, imagery, breathing, attention, acceptance, each with its grade.'
deliverable = 'eight-week skills block + skill cards'
aim = 'teach a small set of psychological skills inside normal training, knowing how strong the evidence is for each'
takes = 'SP1, SP2, SP4'
gives = 'the skills SP6 puts under pressure, SP8 uses on the day and SP10 places in the season; the skill cards DD-SP3 extends'
[[pack.courses.units]]
code = 'SP6'
title = 'Training under pressure'
scope = 'Why calm practice does not transfer, what pressure training shows, how to build pressure into sessions with minors, and routines.'
deliverable = 'four-week pressure-training block + a routine builder'
aim = 'build pressure into practice safely, so that skills hold in competition'
takes = 'SP3, SP4, SP5'
gives = 'the pressure ladder and step-down rule DD-SP1 examines and DD-SP3 trains its techniques on; the routine builder SP8 uses'
[[pack.courses.units]]
code = 'SP7'
title = 'Reading and responding to an athlete'
scope = 'What faces can and cannot tell you, baselines, asking, how one person steadies another, and the response an athlete needs against the one they want.'
deliverable = 'baseline sheet + state-response table + asking scripts'
aim = "respond to an athlete's state from their baseline and their own words, and choose the response they need"
takes = 'SP2, SP3, SP4'
gives = 'the baseline sheet and state-response table SP8 uses on the day and SP9 reads for red flags'
[[pack.courses.units]]
code = 'SP8'
title = 'Competition day'
scope = "The day in phases, what the coach controls in each, the last minute, between rounds, after a loss and after a win, parents, and the coach's own state."
deliverable = "competition-day protocol + debrief card + a parents' note"
aim = 'run a competition day by a written protocol, including what you say in the last minute and after the result'
takes = 'SP4, SP5, SP6, SP7'
gives = "the protocol SP10 places in the season; the coach's own noise, which DD-SP3 points back to"
[[pack.courses.units]]
code = 'SP9'
title = 'Wellbeing, red flags and referral'
scope = 'What the consensus statements ask of a coach, recognising without diagnosing, the first conversation, urgent risk, and the referral route.'
deliverable = 'red-flag table + referral plan + three conversation scripts'
aim = 'recognise the signs that mean referral, hold the first conversation, and know the route before you need it'
takes = 'SP1, SP2, SP4, SP7'
gives = 'the red-flag table and referral plan SP10, DD-SP1 and DD-SP2 point to'
[[pack.courses.units]]
code = 'SP10'
title = 'The season plan'
scope = 'Putting it together: a one-page formulation per athlete, skills across the season, parents, measuring, and what it costs in time.'
deliverable = 'two formulations + a season plan + a weekly review'
aim = 'write a season plan for your own squad and a one-page formulation for two athletes'
takes = 'SP2 to SP9'
gives = "the plan the deep dives' deliverables are added to"
[[pack.courses.units]]
code = 'DD-SP1'
title = "Deep dive: the coach's line with minors"
scope = 'Power, the definitions of abuse, what harsh coaching does and does not do, a test for any comment, touch, one-to-one and messaging, and the duty to act.'
deliverable = 'comment test with worked rewrites + a conduct code + a report-or-not table'
aim = 'state where demanding coaching ends and harm begins, test any comment against it, and act when someone else crosses it'
takes = 'SP1, SP2, SP3, SP6, SP9'
gives = 'the definitions and the comment test DD-SP2 maps weight pressure onto'
[[pack.courses.units]]
code = 'DD-SP2'
title = 'Deep dive: weight, body and who decides'
scope = "Weight-class, judged and endurance sports: low energy availability, rapid weight loss, body image, and the coach's pressure over a class."
deliverable = 'who-decides protocol + language card + conversation scripts + a club weighing policy'
aim = 'handle weight and body shape so that the athlete decides, the growing body is protected, and your language does no harm'
takes = 'SP2, SP3, SP9, DD-SP1'
gives = 'nothing a later unit depends on; DD-SP3 does not treat weight'
[[pack.courses.units]]
code = 'DD-SP3'
title = 'Deep dive: tuning out the noise'
scope = 'The techniques an athlete can carry into competition: cue words, distanced self-talk, reappraisal, if-then plans, resets, breathing, acceptance.'
deliverable = 'twelve technique cards + a cue-word builder + a four-week plan + a pocket card'
aim = 'give each athlete a small set of trained techniques for shutting out noise in competition, each with its grade'
takes = 'SP4, SP5, SP6, SP7, SP8'
gives = "nothing; it is the course's last unit"

