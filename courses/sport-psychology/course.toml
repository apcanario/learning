# sport-psychology: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The third public course (16 Nov 2026, row S-SP0; docs/sport-psychology-syllabus.md): written for any coach, adapted from
# nothing. `source_units = false` tells kit/thin.py that its writer's packet has no source units, carries the course's seed
# bibliography, and holds only Parts 1 and 7 of the sourcing standard.

id = "sport-psychology"
family = "markdown"
short = "Sport Psychology (public)"
label = "SPORT PSYCHOLOGY"
name = "Sport Psychology for Coaches"
color = "var(--orange)"
home_id = "sport-psychology"
status = "in progress"
tracks.SP = ["sports", "Sport psychology · public"]
tiles.SP = "Mental skills, climate and referral for coaches of athletes aged 10 to 25."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/sport-psychology/course.toml"
vault = "courses/sport-psychology"
sourcing_part = "Part 7"
source_units = false
# kit/next_prompt.py prints this course's rows from the template there
prompts_doc = "docs/sport-psychology-prompts.md"
eyebrow = "SPORT PSYCHOLOGY"

# ---- the pack (S-DEC2, 20 Nov 2026): the course data, read by kit/pack.py (its docstring is the schema) -------
# Everything below sits under [pack]; kit/courses.py strips it from the registry dict. Also in the pack: briefs.md
# (the preamble and every brief, word for word), pages/*.md (the long HTML blocks), notes/ (case and syllabus-flags
# files). Derived, not typed here: STATUS (from each unit's `written`; [pack.status] only where the typed string
# differs), NEXT_UNIT, the units' READINGS (their front matter `intro` and `name`), VERSION (the top changelog row).
[pack]
course_note = "Every unit is sourced to consensus statements, meta-analyses and peer-reviewed studies, grades each recommendation by its evidence, names the sample behind each finding, says where a coach's part ends, and ends with a deliverable built in full on three fictional athletes and then as a template."
order_lede = 'One row per unit in writing order, which is the reading order. Opus 5.5 writes; a fresh Opus 5.5 context checks each unit before filing. "Search" means the unit is written with web search on because its facts are current.'
order_foot = 'The count starts at {start}.'
# not read by any kit/ script (the v5.1 standalone hub's identity and tiles); kept as the record. TEMPLATE_BLOCKS was [].
title = 'Sport Psychology for Coaches'
bar = 'SPORT PSYCHOLOGY'
brand_html = 'SPORT PSYCHOLOGY <span>/</span> FOR COACHES'
out = 'sport-psychology.html'
theme_key = 'sport-psychology-theme'
learn_c = 'var(--orange)'
build_c = 'var(--gold)'
home_lede = "For coaches of athletes aged 10 to 25: how young athletes develop, how to teach mental skills that hold under pressure, how to respond on the day, and where a coach's part ends. Every claim sourced and graded."
home_h1 = 'Sport Psychology for Coaches'
learn_note = 'Order of writing: the ten core units in reading order, SP1 to SP10, then the three deep dives; SP9, DD-SP1 and DD-SP2 with search on.'
