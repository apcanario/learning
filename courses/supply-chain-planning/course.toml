# supply-chain-planning: one Academy course, read by kit/courses.py (S-DEC1, 20 Nov 2026). The keys are the course dict build.py reads;
# kit/courses.py turns `parts`, `eras` and `ticks` rows and `tracks` values into tuples. Text fields may use the
# placeholders {content_mods} {total_mods} {nrep} {kwords} (kit/courses.py docstring).
#
# The fifth public course (designed 21 Nov 2026 on Fable 5.2, filed 22 Nov 2026 by row S-SCP0; docs/supply-chain-planning-syllabus.md):
# written for anyone who builds, sells or implements supply chain planning software, adapted from nothing, the second course of the
# Supply Chain track. Like supply-chain-execution: no source units, a seed bibliography, its own prompts document. `dated_lists = true`
# tells kit/private_terms.py that its pages may name the owner's employer as one entry of a dated analyst list, and nowhere else
# (syllabus flag F1). Registry keys copied from courses/supply-chain-execution/course.toml and changed as the design's course-pack.toml
# header says; the [pack] table is that file's, with the keys the schema needs filled in the Execution course's form.

id = "supply-chain-planning"
family = "markdown"
short = "Supply Chain Planning (public)"
label = "SUPPLY CHAIN PLANNING"
name = "Supply Chain Planning for Product Teams"
color = "var(--teal)"
home_id = "supply-chain-planning"
status = "in progress"
tracks.SCP = ["supply-chain", "Supply chain planning · public"]
tiles.SCP = "Forecasting, inventory targets, replenishment and the monthly planning cycle: the decisions that tell execution what to move."
# the course data: the [pack] table below, read by kit/pack.py (S-DEC2)
data = "courses/supply-chain-planning/course.toml"
vault = "courses/supply-chain-planning"
