# STATUS where the typed string is not "written <d Mon>" of the unit's front matter `written`
[pack.status]

[[pack.courses]]
key = 'SCP'
name = 'Supply Chain Planning for Product Teams'
color = 'var(--teal)'
slug = 'scp'
goal = 'by the end, the reader can take any screen, feature or roadmap item in planning software, say which planning decision it serves and on what horizon, who makes that decision and with what data, how it commonly goes wrong, and argue from that what the product should do.'
tile = 'For people who build, sell or implement planning software with no planning background: how demand is forecast, how stock is set and replenished, how plans are made and agreed, who does that work, and what planning software is said to be worth. Every claim sourced and graded.'
intro = 'Learning the domain: the planning decisions from a demand forecast to a released order, for a retailer, a distributor and a manufacturer. Decisions first, then the people and the product, with demand and inventory given the most room. Concepts without calculation; forecasting and optimisation methods are treated on their evidence, generative AI is out of scope, no real vendor is assessed, and the worked examples use three fictional companies and three fictional vendors. Sixteen core units in an opening and four parts, and two deep dives.'
outcomes = "<li><strong>Outcome 1 · Decisions.</strong> Lays out the planning cascade from demand forecast to released order for a retailer, a distributor and a manufacturer and names, at every step, the decision, its horizon, the role, the data and the common failure, without notes (SCP1 to SCP12).</li><li><strong>Outcome 2 · Evidence.</strong> For any claim about a forecasting method, an inventory policy or a planning process, says what kind of evidence stands behind it, gives its grade, and says what a fair test would need (SCP1, SCP3 to SCP5, SCP8, SCP15, DD-SCP1, DD-SCP2).</li><li><strong>Outcome 3 · Product.</strong> Maps a planning product line onto the cascade, writes role cards for its users and a value case a finance reader would accept, and writes a product strategy memo that rests on them (SCP13 to SCP16).</li>"
[[pack.courses.units]]
code = 'SCP1'
title = 'The planning map, the words and the evidence'
scope = 'What supply chain planning is, the decisions it is made of and their horizons, where each kind of system sits, and how to grade what researchers, analysts and vendors say.'
deliverable = 'planning map + working glossary + the grade key'
aim = 'draw the planning cascade from memory, place any product module on it, and grade a claim by its source and its design'
takes = "nothing; it is the course's first unit"
gives = 'the map, the glossary and the grade key every later unit uses'
[[pack.courses.units]]
code = 'SCP2'
title = 'Demand and its data'
scope = 'What demand is as against sales, the shapes it takes, what moves it, and the data a demand plan rests on.'
deliverable = 'demand profile sheet'
aim = 'describe the demand of an item group by pattern, driver and data, and say what the record hides'
takes = 'SCP1'
gives = 'the demand profiles SCP3 chooses methods for and SCP6 sets stock against'
[[pack.courses.units]]
code = 'SCP3'
title = 'Forecasting methods'
scope = 'The families of forecasting method, from baselines to machine learning: what each takes, assumes and gets wrong, and what the competitions found.'
deliverable = 'method selection table'
aim = 'match a method family to a demand pattern and say what evidence stands behind the match'
takes = 'SCP1, SCP2'
gives = 'the methods SCP4 measures, SCP5 lets people override and SCP13 finds inside a product'
[[pack.courses.units]]
code = 'SCP4'
title = 'Forecast error and what it is used for'
scope = 'How forecast error is measured, why two accuracy figures rarely compare, and what the error is for downstream.'
deliverable = 'measurement plan'
aim = 'say what an accuracy figure rewards and hides, and choose a measure that fits the decision'
takes = 'SCP2, SCP3'
gives = "the measures SCP5 judges overrides by, SCP6 sets safety stock from and SCP15's value case leans on"
[[pack.courses.units]]
code = 'SCP5'
title = 'Judgment, overrides and the demand planner'
scope = 'What planners change in a forecast and with what effect, how functions agree on one number, and the demand planner as a role.'
deliverable = 'override policy + demand planner role card'
aim = 'say where human judgment improves a forecast and where it biases it, and describe the demand planner'
takes = 'SCP3, SCP4'
gives = 'the role card form and the first card for SCP14; the consensus step SCP11 builds on'
[[pack.courses.units]]
code = 'SCP6'
title = 'Why inventory exists and how much'
scope = 'The reasons stock is held, service as a target, and what moves the amount of stock a service level needs.'
deliverable = 'inventory purpose map + service policy table'
aim = 'say why a given stock exists, what would shrink it, and what a service target means'
takes = 'SCP2, SCP4'
gives = 'the purposes and service measures SCP7 turns into rules and SCP8 spreads over a network'
[[pack.courses.units]]
code = 'SCP7'
title = 'Replenishment'
scope = 'When to order and how much: the standard policies, the constraints that override them, and what people and bad records do to the rule.'
deliverable = 'replenishment policy decision table + flow map'
aim = 'match a replenishment policy to an item group and name the constraint and the failure that go with it'
takes = 'SCP6'
gives = 'the policies SCP8 links across sites; the replenishment analyst for SCP14'
[[pack.courses.units]]
code = 'SCP8'
title = 'The network: stock in more than one place'
scope = 'Where stock is held across sites, how shortage is shared, and what the bullwhip research did and did not find.'
deliverable = 'stock positioning map + bullwhip cause table'
aim = 'explain where a network holds its stock and why, and how orders amplify upstream'
takes = 'SCP6, SCP7'
gives = "the network view SCP9 and SCP10 plan supply into and SCP12 hands to execution"
[[pack.courses.units]]
code = 'SCP9'
title = 'Supply planning for makers'
scope = 'How a manufacturer turns a demand plan into a production schedule and purchase orders: bills of material, the master schedule, requirements planning and capacity.'
deliverable = 'planning cascade map + four role cards'
aim = 'walk a manufacturer from demand plan to purchase order, naming each level, its owner and what breaks'
takes = 'SCP1, SCP6, SCP7, SCP8'
gives = 'the manufacturing cascade SCP11 agrees and SCP12 releases; four role cards for SCP14'
[[pack.courses.units]]
code = 'SCP10'
title = 'Retail and distribution planning'
scope = 'What a retailer and a distributor plan before and after stock is ordered: the financial plan, assortment, allocation, promotions and markdown.'
deliverable = 'season plan calendar + promotion planning sheet + retail role cards'
aim = 'walk a retailer from season plan to store allocation and markdown, and say how a distributor differs'
takes = 'SCP2, SCP3, SCP7, SCP8'
gives = 'the retail cascade SCP12 releases; the retail role cards for SCP14'
[[pack.courses.units]]
code = 'SCP11'
title = 'Sales and operations planning'
scope = 'The monthly cycle that agrees one plan for demand, supply and money: its steps, its roles, its incentives and its evidence.'
deliverable = 'cycle calendar + decision log + role and conflict table'
aim = 'describe the monthly cycle step by step and say what each function brings, wants and resists'
takes = 'SCP5, SCP9, SCP10'
gives = "the agreed plan SCP12 hands to execution; the conflicts SCP14's matrix collects"
[[pack.courses.units]]
code = 'SCP12'
title = 'Where the plan meets execution'
scope = 'How a plan becomes orders, what has to come back from the floor, and what happens to the plan when the day goes wrong.'
deliverable = 'plan-to-execution handoff table + exception table'
aim = 'name each handoff from plan to execution, what must come back, and who replans when it breaks'
takes = 'SCP7 to SCP11'
gives = "the handoffs SCP13's capability list ends on and SCP16's memo can argue from"
[[pack.courses.units]]
code = 'SCP13'
title = 'The planning system as a product'
scope = "The planning system as something built and sold: modules, the data model, the engine, the planner's screen, and a product line mapped onto the cascade."
deliverable = 'capability map of a planning product line'
aim = 'map any planning product line onto the cascade, with the grade of each claim'
takes = 'SCP1 to SCP12'
gives = "the capability map form SCP15's competitor sheet and SCP16's memo reuse"
[[pack.courses.units]]
code = 'SCP14'
title = 'Planners as users'
scope = 'Every planning role set side by side: how planners work, what makes them trust or ignore a recommendation, and the conflicts between roles.'
deliverable = 'full role card set + conflict matrix'
aim = 'describe every planning role in one form and name the standing conflicts between them'
takes = 'SCP5, SCP7, SCP9, SCP10, SCP11'
gives = "the card set and conflict matrix SCP15 and SCP16 use"
[[pack.courses.units]]
code = 'SCP15'
title = 'Buying planning software: what differs'
scope = 'Who buys planning software, how its value is claimed and tested, why projects stall, and the kinds of vendor in the market.'
deliverable = 'value-case sheet + fair-test checklist + competitor sheet'
aim = 'take a claimed gain apart: baseline, measure, evidence, grade, and what would show it false'
takes = 'SCP4, SCP13, SCP14'
gives = "the value case and competitor sheet SCP16's memo rests on; the vendor-told claims DD-SCP2 traces"
[[pack.courses.units]]
code = 'SCP16'
title = 'Capstone: one planning product memo'
scope = "One opportunity argued in full from the course's own material, as a model for the memo the reader writes on real work."
deliverable = 'worked strategy memo + memo template'
aim = "write a product strategy memo on a planning decision from the course's deliverables"
takes = 'SCP1 to SCP15'
gives = "the memo template the deep dives' deliverables can be added to"
[[pack.courses.units]]
code = 'DD-SCP1'
title = 'Deep dive: planning as companies have published it'
scope = 'Five to seven planning practices real companies have put in print, each read for what was done, what was claimed, and who is telling it.'
deliverable = 'comparables table + case reading sheet'
aim = 'read a published planning case for what it shows, who tells it, and what transfers'
takes = 'SCP3, SCP5, SCP8, SCP10, SCP11, SCP14'
gives = 'the documented cases DD-SCP2 takes its company-reported numbers from'
[[pack.courses.units]]
code = 'DD-SCP2'
title = 'Deep dive: the hard numbers'
scope = 'Every number that circulates in planning traced to its origin, and the numbers the field does not have.'
deliverable = 'evidence ledger + list of missing numbers'
aim = 'trace any planning statistic to its source, sample and design, and say what it cannot show'
takes = 'SCP4, SCP5, SCP7, SCP8, SCP15, DD-SCP1'
gives = "nothing; it is the course's last unit"

