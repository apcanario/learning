# Decisions in review

[[decisions]]
title = "One site, one method, one standard"
key = true
verdict = "held"
section = "Strategy"
what = "Two course projects with different rules were merged into one repo, one written method and one site, in a day."
tradeoff = "The history courses had to be converted to the common format, and the second hub was retired."
evidence = "Every course since has been added as a folder under the same rules: 13 courses, 239 units (docs/method.md §1; docs/courses-index.md)."
insight = "When two efforts start to contradict each other, the merge is cheapest on the day it is noticed."

[[decisions]]
title = "An independent check on every unit"
key = true
verdict = "held"
section = "Quality"
what = "No unit is filed until an agent that never saw it written has checked every cited claim."
tradeoff = "Roughly twice the agents per unit, and drafts that get thrown away."
evidence = "History reports scored 4.28 without a checker and 4.8 with one. The first audit of the brand course failed 23 of 91 sampled claims; the rule was extended that day. A later unit's first draft was rejected with four errors (docs/method.md §1 and §5)."
insight = "I let a measurement set the rule, and the rule has since caught what I would have read past."

[[decisions]]
title = "Split the models by cost"
key = false
verdict = "held"
section = "Orchestration"
what = "The top model designs only. A cheap model runs the session. Mid-tier agents do the writing and checking."
tradeoff = "The top model no longer audits finished units."
evidence = "33 units written under the split since 15 Nov, each with its check report (docs/method.md §4; audits/)."
insight = "Managing AI is managing a budget. The saving came from what the expensive model stopped reading."

[[decisions]]
title = "A course is a folder"
key = false
verdict = "held"
section = "Planning ahead"
what = "Content was separated from the builder before more units were written."
tradeoff = "Unit writing stopped until the refactoring was finished."
evidence = "Four courses registered since without editing a file of the builder (docs/courses-index.md: Supply Chain Planning, AI in Supply Chain Execution, Athlete's Career, Egypt)."
insight = "Paying for the architecture before the fifth course was cheaper than after the tenth."

[[decisions]]
title = "Facts that age carry a date"
key = false
verdict = "held"
section = "Quality"
what = "A unit that rests on prices, platform rules or model lineups is flagged, searched before writing, and re-checked six months on."
tradeoff = "A standing maintenance bill: 30 re-checks already owed."
evidence = "The dates are in the index and the first falls due on 28 Apr 2027. Untested until then."
insight = "A course on a moving subject is a subscription. Better to price that in on the day it is written."

[[decisions]]
title = "Veto, not approve"
key = false
verdict = "held"
section = "Orchestration"
what = "Proposals are listed, flagged if they disrupt anything, and worked in the next session unless I remove them."
tradeoff = "Work goes ahead on proposals I may not have read closely."
evidence = "The queue stopped waiting on me: sessions of four units run unattended from one two-line starter (docs/method.md §8)."
insight = "My approval was the bottleneck. A veto keeps the control and removes the wait."

[[decisions]]
title = "Design outran writing"
key = true
verdict = "needs work"
section = "Product"
what = "Four new courses were designed in one day, on top of one in progress."
tradeoff = "Breadth of plan was bought with a queue that grows faster than it is worked."
evidence = "141 units are designed and unwritten against 239 written: 13 left in Supply Chain Execution, then 18, 14, 18 and 78 (docs/courses-index.md, 27 Nov 2026)."
insight = "Designing a course is the enjoyable part and costs a day. I need a limit on designed-but-unwritten courses, as I would on any roadmap."

[[decisions]]
title = "A page that passed every check and failed on sight"
key = false
verdict = "needs work"
section = "Where it went wrong"
what = "A new home page was specified, built, checked by two independent agents and shipped."
tradeoff = "None intended. The process had no step where I looked."
evidence = "I rejected it from a screenshot on 4 Nov and had it rebuilt."
insight = "A checker verifies the spec. For anything visual, my look belongs before the release, not after."

[[decisions]]
title = "Expensive audits before the cost was understood"
key = false
verdict = "needs work"
section = "Orchestration"
what = "Finished units were audited by the most capable model, with the session chat reading everything."
tradeoff = "Quality assurance was bought at a price nobody had estimated."
evidence = "One audit run was cut off by a spend limit on 27 Oct, leaving six reports unchecked; the audits were stopped on 15 Nov (docs/method.md §1, Audit cadence)."
insight = "Estimate the cost of a review process before making it a rule."

[[decisions]]
title = "The records outgrew their readers"
key = false
verdict = "needs work"
section = "Planning ahead"
what = "Every session is logged in full in one backlog and one changelog."
tradeoff = "Completeness was bought with files no session can afford to read whole."
evidence = "The backlog is 135 KB and the changelog 285 KB after one month (docs/, 27 Nov 2026). The courses index was already split in two on 17 Nov."
insight = "A record needs an archive rule from the start, or the memory becomes the cost."

[[decisions]]
title = "No reader but me is measured"
key = false
verdict = "needs work"
section = "Product"
what = "Five courses were written for other readers: coaches, designers, product teams."
tradeoff = "No accounts and no tracking keeps the site simple and private."
evidence = "The records hold no reader data of any kind."
insight = "A product for others needs one signal from them. A public course without it is still a private one."

