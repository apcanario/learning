[[orchestration]]
role = "Design"
model = "Fable"
why = "Syllabi and briefs only. The most capable model decides what a course is and writes none of it."

[[orchestration]]
role = "Run"
model = "Sonnet 5.5"
why = "Runs a session of up to four units without opening one: it stages packets, launches agents and reads their six-line replies."

[[orchestration]]
role = "Write, check, apply, file"
model = "Opus 5.5, a fresh agent each"
why = "The checker has not seen the unit written. Leaked context is how a course starts repeating itself."

[[checks]]
name = "Fresh check"
what = "Every cited claim against its source and the deliverable against the brief, before filing. A source that will not open is not a pass."

[[checks]]
name = "Index and private-terms checks"
what = "Every unit row, count and re-check date against the files; no private term on a public page."

[[checks]]
name = "Layout suite"
what = "Headless browser at phone, tablet and desktop sizes: 35 checks, including every figure inside its frame."

[[checks]]
name = "Publish read-back"
what = "After publishing, each file's hash is read back and compared."

