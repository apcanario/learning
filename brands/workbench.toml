# Brand 'workbench' (S-DEC3, 20 Nov 2026): the second brand, the proof that a site's name, copy, colours, fonts, repo
# link base and storage keys are one file (docs/decoupling.md §1). Used by editions/marketing-ai.toml. The keys are the
# ones brands/academy.toml describes. Its repo and id_base are placeholders on a reserved domain (example.org).

name = "Workbench"
mark = "WORK<span>/</span>BENCH"
lede = "Courses on marketing and on building with AI, one unit at a time. Pick up where you left off."
repo = "https://example.org/workbench"
id_base = "https://example.org/workbench/"
fonts_href = "https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Source+Serif+4&display=swap"
log_area = ["Workbench", "The site and its method"]
# S-DEC5: the theme's and shell.js's comments (the maintainer's notes) stay out of this brand's shell
strip_comments = true

[storage]
theme = "wb-theme"
tab = "wb-last-report"
units = "wb-groups-open"
last = "wb-last-"
section = "wb-sec-"

# both themes: the serif face, then the dark palette (the theme's default). Only --serif changes. A brand may change
# --sans or --mono too, naming the faces' metrics in [metrics] (P-DEC5; brands/academy.toml header): S-DEC3's first
# probe changed them without metrics and failed figure geometry 24 times
[tokens]
serif = '"Source Serif 4",Georgia,"Times New Roman",serif'
bg = "#0d1117"
card = "#161b22"
line = "#21262d"
line-2 = "#30363d"
fg = "#e6edf3"
muted = "#9da7b3"
dim = "#6e7681"
red = "#ff7b72"
orange = "#f0883e"
teal = "#3fb9a8"
blue = "#58a6ff"
purple = "#bc8cff"
gold = "#e3b341"
bar-bg = "rgba(13,17,23,.94)"
code = "#11161d"

[tokens_light]
bg = "#f6f8fa"
card = "#fbfcfd"
line = "#d0d7de"
line-2 = "#afb8c1"
fg = "#1f2328"
muted = "#4d5560"
dim = "#5c636c"
red = "#c21c26"
orange = "#a54200"
teal = "#0b6e62"
blue = "#0a5bc4"
purple = "#7340d0"
gold = "#7d5600"
on-accent = "#f7f8f9"
bar-bg = "rgba(246,248,250,.94)"
code = "#eef1f4"
